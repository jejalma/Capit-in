[server]
headless = true
enableCORS = false
enableXsrfProtection = false
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#0F4C5C"
backgroundColor = "#F6F3EC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2A2E"
borderColor = "#E6E1D6"
baseRadius = "8px"
font = "Roboto:https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
codeFont = "Roboto Mono:https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
